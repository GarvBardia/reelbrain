# Render Blueprint — free-tier web service for Mycelium (internal codename
# "reelbrain"; the service name is left alone deliberately, see README.md).
# Values for the env vars are NOT stored here (this file is committed) — paste
# them into the Render dashboard; see DEPLOYMENT.md for the click-by-click steps.
services:
  - type: web
    name: reelbrain
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DB_ID
        sync: false
      - key: NOTION_CREATORS_DB_ID
        sync: false
      # Needed for the weekly digest and cookie-health alert pages (both create
      # pages directly under this page, not in a database). See DEPLOYMENT.md.
      - key: NOTION_PARENT_PAGE_ID
        sync: false
      - key: BURNER_COOKIES_FILE
        value: ./cookies.txt
      - key: BURNER_ACCOUNT_USERNAME
        sync: false
      - key: REAL_ACCOUNT_GUARD
        sync: false
      - key: CAPTURE_SECRET
        sync: false
      - key: DB_PATH
        value: ./data/reelbrain.db
      - key: MAX_FETCHES_PER_DAY
        value: "25"
      - key: MIN_FETCH_SPACING_SECONDS
        value: "20"
      # Cookie-health alerting — see COOKIES.md.
      - key: COOKIE_HEALTH_THRESHOLD
        value: "3"
      - key: NTFY_TOPIC
        sync: false
      # --- public frontend (Vercel) — see FRONTEND_DEPLOY.md ---
      # Comma-separated origins allowed to read the public API from a browser.
      # Set this to the Vercel production domain AFTER the first frontend
      # deploy. localhost:3000 and *.vercel.app previews are allowed in code,
      # so this is only needed for the production domain.
      - key: PUBLIC_CORS_ORIGINS
        sync: false
      # Per-IP cap on /api/public/* (separate from the write-path limiter).
      - key: PUBLIC_RATE_LIMIT_PER_MINUTE
        value: "120"
      # How long the API caches the Notion corpus for public reads. Matches
      # the frontend's ISR `revalidate` so the two layers do not fight.
      - key: PUBLIC_CACHE_TTL_SECONDS
        value: "300"
