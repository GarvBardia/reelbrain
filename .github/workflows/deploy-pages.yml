name: Deploy Mycelium to GitHub Pages

# Builds web/ as a fully static site (Next.js `output: "export"`) and
# publishes it to GitHub Pages. No server, no secrets in this workflow --
# NEXT_PUBLIC_API_BASE points at the already-public Render API and is not
# sensitive; see web/src/lib/api.ts.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-flight one rather
# than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Change this if the Render service is ever renamed or moved to a
      # custom domain (see FRONTEND_DEPLOY.md §7).
      NEXT_PUBLIC_API_BASE: https://reelbrain.onrender.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build
        # next.config.mjs sets output:"export", so `next build` alone
        # produces web/out/ -- no separate `next export` step needed.

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
