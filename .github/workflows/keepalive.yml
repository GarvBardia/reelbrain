name: keepalive
on:
  schedule:
    - cron: "*/10 2-18 * * *"   # every 10 min, 02:00-18:59 UTC = 07:30-00:29 IST
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping to keep the Render instance warm
        run: curl -sf "$RENDER_URL/ping"
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
